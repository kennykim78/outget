# WithSmall 운영 compose(내부 테스트). 배포 위치: /opt/withsmall/compose.yaml — 상대 경로는 이 파일 기준.
#   이미지 태그는 deploy.sh 가 state/image.env(WS_IMAGE=ghcr.io/<owner>/<repo>:sha-<12>)로만 바꾼다.
#   시크릿은 server.env·caddy.env(0600, 저장소 밖)에서만. 이 파일에 값 없음.
#   로그: journald(bootstrap.sh 가 7일·500M 보관) — 앱·Caddy 모두 IP·요청 주소를 남기지 않는다(docs/ops/deploy.md 7절).
#   불변식 ④ 결제 없음 · ⑧ 위치 저장 없음 — 이 구성은 두 컨테이너(app·caddy)뿐.
#   격리(security 139 LOW-2): 두 컨테이너 모두 read_only 루트 + tmpfs /tmp(noexec) — 쓰기는 볼륨(app /data · caddy /data·/config)과 /tmp 뿐.
#     이미지의 /app 은 root 소유(Dockerfile) → app 사용자는 코드를 바꾸지 못한다. 자원 상한: A1.Flex 1 OCPU(vCPU 1) / 6 GB 기준(mem·cpus·pids) — cpus 는 서비스마다 1.0 이하여야 docker 가 컨테이너를 만든다(ORDERS §33).
#   caddy 이미지는 다이제스트 고정(LOW-3) — 갱신 절차 docs/ops/deploy.md 6절 '베이스 이미지 갱신'.
name: withsmall

services:
  app:
    image: ${WS_IMAGE:?WS_IMAGE 필요 - deploy.sh 로 기동}
    restart: unless-stopped
    env_file:
      - ./server.env
    # SQLite 임시 파일을 /data 볼륨 안에(QA148 MED-1 — read_only 에서 tmpfs /tmp 64m 로 떨어지면 큰 DB 의 VACUUM 실패). 이미지 ENV 와 같은 값.
    environment:
      - SQLITE_TMPDIR=/data/.sqlite-tmp
    volumes:
      - ./data:/data
    # 호스트 포트 없음 — caddy 만 내부 네트워크로 접근한다.
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: journald
      options:
        tag: withsmall-app

  caddy:
    # caddy:2.11-alpine(2.11.7) 멀티 아키텍처 인덱스 다이제스트 — 2026-10-28 고정.
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # basic_auth 사용자·bcrypt 해시(WS_BASIC_USER·WS_BASIC_HASH). env_file 이어야 한다 — compose 파일 보간에 해시의 $ 가 먹히지 않게.
    env_file:
      - ./caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: journald
      options:
        tag: withsmall-caddy

volumes:
  # 인증서·ACME 계정. 지우면 재발급(발급 한도 주의, 위험 R12).
  caddy_data:
  caddy_config:
