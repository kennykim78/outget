<!-- @dsCard group="Composition" height=300 subtitle="세 구성안" -->
<style>
body{margin:0;background:var(--bg-000);font-family:var(--font-sans);color:var(--ink)}
.stack{width:328px;margin:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);display:grid;grid-template-columns:32px 1fr auto;gap:var(--space-1) var(--space-3);align-items:center}
.gl{font-size:22px;color:var(--brand-text);grid-row:1/3}
.name{font-size:16px;font-weight:700;line-height:20px}
.purpose{font-size:13px;line-height:18px;color:var(--ink-muted);grid-column:2}
.right{text-align:right;grid-row:1/3}
.cnt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:24px}
.range{font-size:13px;line-height:18px;color:var(--ink-muted)}
.note{font-size:13px;line-height:18px;color:var(--ink-muted)}
</style>
<div class="stack">
  <div class="card"><span class="gl">🌿</span><div class="name">실속</div><div class="purpose">꼭 필요한 것부터</div><div class="right"><div class="cnt">6개</div><div class="range">7만 원대</div></div></div>
  <div class="card"><span class="gl">☁</span><div class="name">균형</div><div class="purpose">기본에 편의성을 더해서</div><div class="right"><div class="cnt">8개</div><div class="range">12만 원대</div></div></div>
  <div class="card"><span class="gl">♻</span><div class="name">기존 물품 활용</div><div class="purpose">가지고 있는 것부터 다시 구성</div><div class="right"><div class="cnt">새로 4개</div><div class="range">5만 원대~</div></div></div>
  <div class="note">예상 금액은 참고 범위예요. 최저가를 보장하지 않아요.</div>
</div>
