<!-- @dsCard group="Judgement" height=330 subtitle="제품 규격 / 내 환경 호환 2단" -->
<style>
body{margin:0;background:var(--bg-000);font-family:var(--font-sans);color:var(--ink)}
.card{width:328px;margin:var(--space-4);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.hd{font-size:13px;line-height:18px;color:var(--ink-muted)}
.line{border-radius:var(--radius-sm);padding:var(--space-3);display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-2);align-items:baseline}
.line .lab{grid-column:1/3;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;color:var(--ink-muted)}
.line .g{font-weight:700;font-size:18px}
.line .v{font-size:18px;line-height:24px;font-weight:700}
.line .why{grid-column:2;font-size:14px;line-height:20px}
.fail{background:var(--status-fail-soft)}.fail .g,.fail .v{color:var(--status-fail)}
.chk{background:var(--status-check-soft)}.chk .g,.chk .v{color:var(--status-check)}
.num{font-size:28px;line-height:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.alt{font-size:14px;line-height:20px;color:var(--ink)}
.alt b{color:var(--brand-text)}
.cta{display:flex;gap:var(--space-2)}
.btn{flex:1;min-height:44px;border-radius:var(--radius-md);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface)}
.btn.fill{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
</style>
<div class="card">
  <div class="hd">쳇바퀴 · 골든햄스터 기준</div>
  <div class="line fail"><span class="lab">제품 규격</span><span class="g">✕</span><span class="v">최소 규격 미달</span><span class="why">최소 <span class="num">28cm</span> · 입력 25cm</span></div>
  <div class="line chk"><span class="lab">내 환경 호환</span><span class="g">△</span><span class="v">공간 조건 재확인</span><span class="why">케이지 높이 35cm, 쳇바퀴+4cm 여유가 필요해요</span></div>
  <div class="alt">이것 대신 <b>러닝 디스크 28cm 이상</b>으로도 구성할 수 있어요</div>
  <div class="cta"><div class="btn">대안 보기</div><div class="btn fill">이 조건으로 찾기</div></div>
</div>
