name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: secret scan(history) -> compliance -> seed guard -> seed validate -> lint -> typecheck -> build -> secret scan(dist) -> compliance(out) -> test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # 비밀값 스캔(gitleaks — 작업 247, 계획 243 C3). 서드파티 액션·토큰·새 권한·secrets 0.
      #   고정 버전 공식 릴리스 아카이브를 받아 저장소 핀(scripts/gitleaks-pin.json)의 sha256 과 대조한 뒤에만 푼다.
      #   같은 릴리스의 checksums.txt 는 쓰지 않는다(같은 출처 — 핀이 기준). 핀 갱신 절차: docs/ops/secret-scan.md.
      - name: Install gitleaks (pinned version, sha256 verified)
        run: |
          set -eu
          pin=scripts/gitleaks-pin.json
          ver="$(jq -er .version "$pin")"
          sum="$(jq -er .sha256.linux_x64 "$pin")"
          printf '%s\n' "$ver" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
          printf '%s\n' "$sum" | grep -Eqx '[0-9a-f]{64}'
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$dir/gitleaks.tar.gz" "$url"
          printf '%s  %s\n' "$sum" "$dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          test "$("$dir/gitleaks" version)" = "$ver"
          echo "$dir" >> "$GITHUB_PATH"

      # 전체 이력(모든 ref — fetch-depth 0). 이력 오탐은 .gitleaksignore 지문으로만. 값은 --redact 로 가린다.
      - name: Secret scan (gitleaks, full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="--all" .

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # Prisma client 생성 — typecheck/build/test 가 @prisma/client 를 import 하므로 선행 필수.
      - name: Prisma generate
        run: npm run prisma:generate --workspace server

      # 컴플라이언스/시크릿 스캔 — 가장 먼저, 빠른 실패. 5 불변식 강제 장치.
      - name: Compliance & secret scan
        run: node scripts/compliance-scan.mjs --now "$(TZ=Asia/Seoul date +%F)"

      - name: Seed review transition guard (M4)
        if: github.event_name == 'pull_request'
        run: node scripts/seed-review-diff.mjs --base "origin/${{ github.base_ref }}"

      - name: Seed validate
        run: npm run seed:validate --workspace server -- --now "$(TZ=Asia/Seoul date +%F)"

      - name: Seed equivalence (draft vs server seed)
        run: node scripts/seed-equivalence.mjs

      - name: Lint
        run: npm run lint

      - name: Design tokens in sync
        run: node scripts/gen-tokens.mjs --check

      - name: Typecheck (client)
        run: npm run typecheck --workspace client

      - name: Typecheck (server)
        run: npm run typecheck --workspace server

      - name: Build
        run: npm run build

      # 빌드 산출물에 구워진 비밀값(VITE_* 빌드 인자 등) — 이력 스캔이 못 보는 영역(작업 247, 계획 243 C3).
      - name: Secret scan (gitleaks, build output)
        run: |
          set -eu
          gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 client/dist
          gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 server/dist

      - name: Perf build shape (after-paint loader · font split)
        run: node scripts/check-perf-shape.mjs

      - name: Compliance (prerender output)
        run: node scripts/compliance-scan.mjs --require-output --now "$(TZ=Asia/Seoul date +%F)"

      - name: Test (client)
        run: npm test --workspace client

      - name: Test (server)
        run: npm test --workspace server

      - name: Test (scripts)
        run: npm run test:scripts

  docker:
    name: docker build + boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker build (no push)
        run: docker build --build-arg SITE_ORIGIN=https://ci.example -t ws-ci .

      # 운영 compose(deploy/compose.yaml)와 같은 격리로 기동한다 — read_only 루트 + tmpfs /tmp + 자원 상한 + cap 전부 제거(security 139 LOW-2).
      - name: Image /app is not writable by the app user (root-owned)
        run: |
          set -eu
          docker run --rm --entrypoint sh ws-ci -c 'id -u; for d in /app /app/server /app/server/dist /app/client/dist /app/node_modules; do if [ -w "$d" ]; then echo "writable: $d"; exit 1; fi; done; [ -w /data ]'

      - name: Boot smoke (/health)
        run: |
          set -eu
          VOL="$(mktemp -d)"
          chmod 777 "$VOL"
          JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
          REACTION_KEY_SECRET="$(openssl rand -hex 32)"
          docker run -d --name ws-ci-smoke -p 3001:3001 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --memory 1g --cpus 1.5 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e PUBLIC_ORIGIN=https://ci.example \
            -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e REACTION_KEY_SECRET="$REACTION_KEY_SECRET" \
            -e TRUST_PROXY=0 \
            -e DATABASE_URL=file:/data/prod.db \
            -e WS_ALLOW_PRIVACY_PLACEHOLDER=1 \
            -e SQLITE_TMPDIR=/data/.sqlite-tmp \
            -v "$VOL:/data" \
            ws-ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs ws-ci-smoke || true
            docker rm -f ws-ci-smoke || true
            exit 1
          fi
          docker rm -f ws-ci-smoke

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace server

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (default seed)
        run: npm run e2e

      - name: E2E (real seed)
        run: npm run e2e
        env:
          E2E_SEED: real
