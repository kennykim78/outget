# WithSmall 내부 테스트 배포(Oracle Cloud ap-tokyo-1, A1.Flex arm64). 수동 실행만(workflow_dispatch) — Kenny 2026-10-27.
#   흐름: build-push(GHCR private, sha-<12> 태그, QEMU arm64) → deploy(SSH 강제 명령 deploy-gate.sh → deploy.sh) → 외부 확인(공개 200 · robots Disallow · X-Robots-Tag noindex — ORDERS §40).
#   CI 게이트(ci.yml)가 초록인 커밋에서만 실행한다 — build-push 첫 단계가 GitHub API 로 이 커밋(GITHUB_SHA)의 ci.yml 최신 실행이
#   completed·success 인지 확인하고, 아니면 빌드 전에 멈춘다(QA122 LOW-4). ci.yml 은 pull_request·main push 에서 돈다 → PR 이 열린 커밋이어야 한다.
#   (이미지 빌드 자체도 프리렌더·seed validate·산출물 컴플라이언스를 다시 돈다.)
#   시크릿은 GitHub Secrets 에서 env 로만 받는다 — build-arg·로그·저장소에 없음. 빌드 인자는 Variables(공개 값).
#   Repository Secrets: DEPLOY_SSH_KEY · DEPLOY_HOST · DEPLOY_KNOWN_HOSTS · DEPLOY_USER
#   Repository Variables: SITE_ORIGIN · WS_INDEXABLE · VITE_NAVER_MAP_CLIENT_ID · TARGET_PLATFORM
#   environment: 는 쓰지 않는다(비공개 저장소의 Environments 지원은 요금제에 따라 다름 — 저장소 수준 Secrets/Variables 로 충분).
#   주의: GitHub 는 workflow_dispatch 워크플로 파일이 기본 브랜치(main)에 있어야 실행 버튼·API 를 연다 — docs/ops/deploy.md 8절.
#   main 에서만(security 139 LOW-1): 첫 job require-main 이 github.ref == refs/heads/main 이 아니면 실패 → build-push·deploy(rollback 포함) 모두 안 돈다.
#     운영자 실수 방지 장치다 — 다른 브랜치의 워크플로 파일은 이 검사를 지울 수 있으므로 시크릿 보호 경계는 아니다(docs/ops/deploy.md 8절 E).
#   서드파티 Action 은 커밋 SHA 고정(뒤 주석 = 버전, LOW/MED-4) — 갱신은 Dependabot(.github/dependabot.yml) PR 로만.
name: Deploy (internal test)

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy = 이 커밋을 빌드·배포 / rollback = 서버의 직전 이미지로
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy-internal-test
  cancel-in-progress: false

jobs:
  require-main:
    name: require main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch ref must be main
        env:
          REF: ${{ github.ref }}
        run: |
          set -eu
          echo "dispatch ref: $REF"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "배포·롤백은 main 에서만 실행한다(Run workflow → Branch: main) — docs/ops/deploy.md 8절 E"
            exit 1
          fi

  build-push:
    name: build + push (GHCR)
    needs: require-main
    if: inputs.action == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Require green CI (ci.yml) on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          q='.workflow_runs | sort_by(.created_at) | last | if . == null then "none none" else "\(.status) \(.conclusion // "none")" end'
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=50" --jq "$q")"
          echo "ci.yml latest run on ${GITHUB_SHA::12}: $latest"
          if [ "$latest" != "completed success" ]; then
            echo "ci.yml 이 이 커밋에서 초록이 아니다(없음·진행 중·실패) — PR 로 CI 를 통과시킨 커밋만 배포한다"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and tag
        id: meta
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -eu
          case "$SITE_ORIGIN" in
            https://*) ;;
            *) echo "vars.SITE_ORIGIN 은 https 오리진이어야 한다"; exit 1 ;;
          esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ vars.TARGET_PLATFORM || 'linux/arm64' }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            SITE_ORIGIN=${{ vars.SITE_ORIGIN }}
            WS_INDEXABLE=${{ vars.WS_INDEXABLE || '0' }}
            VITE_NAVER_MAP_CLIENT_ID=${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy (SSH forced command)
    needs: [require-main, build-push]
    if: ${{ always() && needs.require-main.result == 'success' && github.ref == 'refs/heads/main' && (needs.build-push.result == 'success' || (inputs.action == 'rollback' && needs.build-push.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: SSH key and known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACTION: ${{ inputs.action }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          set -eu
          if [ "$ACTION" = "deploy" ]; then CMD="deploy $TAG"; else CMD="rollback"; fi
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$CMD"

      - name: External check (public 200 + robots Disallow + X-Robots-Tag noindex)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -eu
          # 비밀번호 없음(Kenny 2026-11-02, ORDERS §40) — 누구나 연다. 검색 노출 차단은 그대로 확인한다:
          #   robots.txt 에 정확히 "Disallow: /" 줄(빌드 WS_INDEXABLE=0 — server/src/prerender/robots.ts) + 응답 헤더 X-Robots-Tag noindex(Caddyfile).
          #   공개 전환(docs/ops/deploy.md 9절) 때 이 단계의 robots·noindex 기준을 바꾼다.
          t="$(mktemp -d)"
          code=000; rcode=000; robots=no; noindex=no
          for _ in 1 2 3 4 5 6; do
            : > "$t/h"; : > "$t/r"
            code="$(curl -s -o /dev/null -D "$t/h" -w '%{http_code}' --max-time 10 "$SITE_ORIGIN/" || true)"
            rcode="$(curl -s -o "$t/r" -w '%{http_code}' --max-time 10 "$SITE_ORIGIN/robots.txt" || true)"
            if tr -d '\r' < "$t/r" | grep -qxF 'Disallow: /'; then robots=yes; else robots=no; fi
            if tr -d '\r' < "$t/h" | grep -qiE '^x-robots-tag:.*noindex'; then noindex=yes; else noindex=no; fi
            [ "$code" = "200" ] && [ "$rcode" = "200" ] && [ "$robots" = "yes" ] && [ "$noindex" = "yes" ] && break
            sleep 5
          done
          rm -rf "$t"
          echo "external status: $code · robots.txt $rcode Disallow-all=$robots · X-Robots-Tag noindex=$noindex"
          [ "$code" = "200" ] && [ "$rcode" = "200" ] && [ "$robots" = "yes" ] && [ "$noindex" = "yes" ]

      - name: Operator paths 404 check (Phase 0, ORDERS §41)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -eu
          # Phase 0 운영자 경로는 Caddy 에서 외부 404(deploy/Caddyfile @operator — Kenny 2026-11-02 ORDERS §41, security 257 4a·4b).
          #   확인: POST /auth/login·POST /AUTH/LOGIN(대소문자)·GET /admin/ping = 404, 404 응답에도 X-Robots-Tag noindex,
          #   저장 흐름 GET /auth/session 은 404 가 아님(막히지 않음). 리다이렉트는 따라가지 않는다. 3번 × 5초 재시도.
          t="$(mktemp -d)"
          login=000; upper=000; admin=000; session=000; noindex=no; ok=no
          for _ in 1 2 3; do
            : > "$t/h"
            login="$(curl -s -o /dev/null -D "$t/h" -w '%{http_code}' --max-time 10 -X POST "$SITE_ORIGIN/auth/login" || true)"
            upper="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$SITE_ORIGIN/AUTH/LOGIN" || true)"
            admin="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_ORIGIN/admin/ping" || true)"
            session="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_ORIGIN/auth/session" || true)"
            if tr -d '\r' < "$t/h" | grep -qiE '^x-robots-tag:.*noindex'; then noindex=yes; else noindex=no; fi
            if [ "$login" = "404" ] && [ "$upper" = "404" ] && [ "$admin" = "404" ] && [ "$session" != "404" ] && [ "$session" != "000" ] && [ "$noindex" = "yes" ]; then ok=yes; break; fi
            sleep 5
          done
          rm -rf "$t"
          echo "operator paths: POST /auth/login $login · POST /AUTH/LOGIN $upper · /admin/ping $admin · GET /auth/session $session · 404 X-Robots-Tag noindex=$noindex"
          [ "$ok" = "yes" ]

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
